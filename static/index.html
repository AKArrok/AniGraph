<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1225">
  <title>动漫领域大神</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div id="header-left">
        <h1>动漫领域大神</h1>
        <span class="badge">ANIGRAPH</span>
      </div>
      <div id="header-right">
        <div id="model-info">正在连接知识引擎...</div>
        <button id="toggle-panel-btn" type="button" title="切换执行链路" aria-label="切换执行链路" aria-expanded="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
    </header>

    <main id="main-layout">
      <section id="left-panel" aria-label="动漫知识工作台">
        <div id="error-banner" role="alert" aria-live="assertive">
          <span id="error-banner-text"></span>
          <button id="error-dismiss-btn" type="button" aria-label="关闭错误提示">&times;</button>
        </div>

        <div id="chat-messages" aria-live="polite">
          <div id="chat-empty">
            <div class="empty-icon" aria-hidden="true">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 10h8M8 14h5"/></svg>
            </div>
            <div id="empty-title">开始探索动漫世界</div>
            <div id="empty-subtitle">输入问题或上传截图，让动漫领域大神为你查找答案</div>
          </div>
        </div>

        <div id="chat-input-bar">
          <div id="image-preview-row" style="display:none">
            <div id="image-preview">
              <img id="preview-img" alt="待识别的动漫截图">
              <button id="remove-img-btn" type="button" title="移除图片" aria-label="移除图片">&times;</button>
            </div>
          </div>
          <div id="chat-input-row">
            <input type="text" id="query-input" placeholder="向动漫领域大神提问..." aria-label="输入动漫相关问题" autofocus>
            <label id="image-btn" class="icon-btn" title="上传动漫截图">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
            </label>
            <button id="stop-btn" type="button">停止</button>
            <button id="send-btn" type="button">发送</button>
          </div>
          <div id="thread-row">
            <span>会话</span>
            <span id="thread-id">default</span>
            <button id="clear-btn" type="button">清空记忆</button>
          </div>
        </div>
      </section>

      <aside id="right-panel" aria-label="执行链路">
        <h3>Execution Trace · 执行链路</h3>
        <div id="flowchart"><div id="flowchart-empty">等待查询...</div></div>
        <div id="node-detail" style="display:none">
          <h4 id="detail-title"></h4>
          <div id="detail-body"></div>
        </div>
      </aside>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
